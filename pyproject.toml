[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-cls"
version = "0.2.0"
description = "Lightweight CNN (<100k parameters) for radar and communication signal classification from spectrograms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giang Vinh Huy" }]
dependencies = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "numpy>=1.24,<3",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.12,<1",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
tensorboard = ["tensorboard>=2.15"]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8", "ruff>=0.6", "onnx>=1.16", "onnxruntime>=1.18", "wandb>=0.17"]

[project.scripts]
radar-train = "radar_cls.train:main"
radar-evaluate = "radar_cls.evaluate:main"
radar-export = "radar_cls.export:main"
radar-predict = "radar_cls.predict:main"
radar-compress = "radar_cls.compress:main"
radar-experiments = "radar_cls.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
